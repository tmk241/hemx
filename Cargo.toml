[workspace]
resolver = "2"
members = ["hemx", "hemx-core", "hemx-derive", "hemx-js", "hemx-axum", "hemx-build", "hemx-test", "tests/server-wasm", "tests/browser"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/tmk241/hemx"

[profile.release]
opt-level = "z"
lto = true
