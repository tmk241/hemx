[package]
name = "hemx-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Client-local WebAssembly integration for Hemx"
keywords = ["hypermedia", "wasm", "web"]
categories = ["wasm", "web-programming"]

[lib]
path = "src/lib.rs"

[dependencies]
hemx-core = { version = "0.1.0", path = "../hemx-core" }
wasm-bindgen = "=0.2.125"

[dev-dependencies]
serde_json = "1"
thirtyfour = "0.36"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
