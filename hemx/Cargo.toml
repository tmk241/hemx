[package]
name = "hemx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Checked hypermedia for Rust applications"
keywords = ["hypermedia", "html", "web", "rust"]
categories = ["web-programming"]

[lib]
path = "src/lib.rs"

[[bench]]
name = "render"
harness = false

[features]
default = []

[dependencies]
hemx-core = { version = "0.3.0", path = "../hemx-core" }
hemx-derive = { version = "0.3.0", path = "../hemx-derive" }

hemplate = { version = "0.2.0", default-features = false }
