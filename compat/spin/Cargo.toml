[package]
name = "spin"
version = "0.9.8"
edition = "2021"
rust-version = "1.71"
publish = false
license = "MIT"
description = "Workspace compatibility alias from yanked spin 0.9 to maintained spin 0.12"

[features]
default = []
spin_mutex = ["spin_next/spin_mutex"]

[dependencies]
spin_next = { package = "spin", version = "=0.12.2", default-features = false }
