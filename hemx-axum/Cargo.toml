[package]
name = "hemx-axum"
version = "0.5.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Axum integration for Hemx applications"
keywords = ["axum", "hypermedia", "html", "web"]
categories = ["web-programming"]

[lib]
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["multipart", "tokio"] }
futures-util = { version = "0.3", default-features = false }
hemx-core = { version = "0.5.0", path = "../hemx-core" }
hemplate-runtime = { version = "0.3.0", default-features = false }
hemx-js = { version = "0.5.1", path = "../hemx-js" }
tokio = { version = "1", default-features = false, features = ["sync"] }

[dev-dependencies]
hemplate = { version = "0.4.0", default-features = false, features = ["derive"] }
scraper = "0.25"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tower = { version = "0.5", features = ["util"] }
